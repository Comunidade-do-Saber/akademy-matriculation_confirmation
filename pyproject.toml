[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akademy_matriculation_confirmation"
version = "8.0.0"
description = "SAGE Education is a free and open-source education management platform for schools, universities, educators, and governments."
keywords = [
    "education",
    "education-management",
    "school-management",
    "student-information-system",
    "school-information-system",
    "academic-management",
    "learning-management",
    "school",
    "university",
    "college",
    "educators",
    "students",
    "government",
    "open-source",
    "erp",
    "sis",
    "sga",
    "sge",
    "sie",
    "sage-edu",
    "sage-education",
    "school-erp",
    "academic-erp",
    "campus-management",
    "education-platform"
]
authors = [
    { name = "Zacarias Juliano Capingala", email = "zacariasjuliano@gmail.com" }
]
maintainers = [
    { name = "Zacarias Juliano Capingala", email = "zacariasjuliano@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "akademy_classe>=8.0.0",
    "akademy_matriculation>=8.0.0",
]

[project.urls]
Homepage = "https://sage-edu.comunidadedosaber.ao"
Documentation = "https://docs.sage-edu.comunidadedosaber.ao"
Demo = "https://app.sage-edu.comunidadedosaber.ao"
Repository = "https://github.com/comunidade-do-saber/akademy-matriculation_confirmation"
"Bug Tracker" = "https://github.com/comunidade-do-saber/akademy-matriculation_confirmation/issues"
Changelog = "https://github.com/comunidade-do-saber/akademy-matriculation_confirmation/blob/main/CHANGELOG.md"

[tool.poetry]
classifiers=[
    'Development Status :: 5 - Production/Stable',
    'Environment :: Plugins',
    'Framework :: Tryton',
    'Intended Audience :: Developers',
    'Intended Audience :: Developers',
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+) ",
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Topic :: Education',
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.hatch.build]
exclude = ["dist"]

[tool.hatch.build.targets.wheel]
packages = ["trytond"]
